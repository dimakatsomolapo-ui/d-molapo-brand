.black{background:#090909;color:#fff;border:1px solid #c88b22}
.gold{background:#c88b22;color:#090909;border:1px solid #c88b22}
.outline{background:#fff;color:#090909;border:1px solid #090909}
@media(max-width:700px){.top{grid-template-columns:1fr}.photo{height:430px;min-height:0}.content{padding:32px 24px}.logo{margin:0 auto 24px;width:170px}h1{font-size:34px}}
